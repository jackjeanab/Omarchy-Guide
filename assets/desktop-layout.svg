<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24283b"/><stop offset="100%" stop-color="#1f2335"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292e42"/><stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
  </defs>

  <rect width="760" height="500" fill="#16161e"/>
  <text x="380" y="34" fill="#c0caf5" font-size="22" text-anchor="middle" font-weight="bold">Hyprland 桌面佈局示意</text>

  <!-- screen -->
  <rect x="30" y="55" width="700" height="400" rx="12" fill="#1a1b26" stroke="#3b4261" stroke-width="2"/>

  <!-- top bar -->
  <rect x="30" y="55" width="700" height="34" rx="12" fill="url(#bar)"/>
  <rect x="30" y="75" width="700" height="14" fill="url(#bar)"/>
  <text x="52" y="77" fill="#7aa2f7" font-size="13" font-weight="bold">1  2  3</text>
  <text x="360" y="77" fill="#9ece6a" font-size="13" text-anchor="middle">14:32  ·  Omarchy</text>
  <text x="700" y="77" fill="#e0af68" font-size="13" text-anchor="end">音量  Wi-Fi  電池 100%</text>

  <!-- window 1 -->
  <rect x="46" y="105" width="322" height="334" rx="8" fill="url(#w1)" stroke="#7aa2f7" stroke-width="2"/>
  <rect x="46" y="105" width="322" height="30" rx="8" fill="#7aa2f7"/>
  <rect x="46" y="125" width="322" height="10" fill="#7aa2f7"/>
  <text x="60" y="126" fill="#0f1117" font-size="13" font-weight="bold">  終端機 — Alacritty</text>
  <text x="62" y="165" fill="#9ece6a" font-size="13">$ omarchy ai</text>
  <text x="62" y="190" fill="#c0caf5" font-size="13">AI 代理已啟動…</text>
  <text x="62" y="215" fill="#7aa2f7" font-size="13">問：如何安裝 htop？</text>
  <text x="62" y="240" fill="#c0caf5" font-size="13">答：sudo pacman -S htop</text>
  <rect x="62" y="260" width="9" height="16" fill="#9ece6a"/>

  <!-- window 2 -->
  <rect x="384" y="105" width="330" height="334" rx="8" fill="url(#w1)" stroke="#9ece6a" stroke-width="2"/>
  <rect x="384" y="105" width="330" height="30" rx="8" fill="#9ece6a"/>
  <rect x="384" y="125" width="330" height="10" fill="#9ece6a"/>
  <text x="398" y="126" fill="#0f1117" font-size="13" font-weight="bold">  Neovim — main.py</text>
  <text x="400" y="168" fill="#bb9af7" font-size="13">def <tspan fill="#7aa2f7">greet</tspan>(name):</text>
  <text x="416" y="192" fill="#c0caf5" font-size="13">print(f"Hello, {name}")</text>
  <text x="400" y="224" fill="#565f89" font-size="13">-- INSERT --</text>
  <text x="400" y="252" fill="#9ece6a" font-size="12">✓ 已存檔 (Ctrl+S)</text>

  <!-- focus indicator -->
  <text x="380" y="478" fill="#565f89" font-size="13" text-anchor="middle">兩個視窗平均分割畫面；綠色邊框 = 目前焦點。按 Super + ←/→ 切換焦點</text>
</svg>
