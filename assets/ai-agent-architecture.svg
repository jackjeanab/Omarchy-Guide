<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <linearGradient id="user" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/><stop offset="100%" stop-color="#3d59a1"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb9af7"/><stop offset="100%" stop-color="#7847bd"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292e42"/><stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ece6a"/><stop offset="100%" stop-color="#557a3a"/>
    </linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7aa2f7"/>
    </marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#bb9af7"/>
    </marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#565f89"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#1a1b26"/>
  <text x="380" y="40" fill="#c0caf5" font-size="23" text-anchor="middle" font-weight="bold">Omarchy AI 代理運作架構</text>
  <text x="380" y="64" fill="#565f89" font-size="13" text-anchor="middle">代理 = 大腦（模型） + 手腳（工具） + 記憶</text>

  <!-- user -->
  <rect x="290" y="88" width="180" height="56" rx="10" fill="url(#user)"/>
  <text x="380" y="113" fill="#0f1117" font-size="17" text-anchor="middle" font-weight="bold">你（使用者）</text>
  <text x="380" y="132" fill="#0f1117" font-size="12" text-anchor="middle">用自然語言下指令</text>

  <!-- agent -->
  <rect x="255" y="196" width="250" height="78" rx="12" fill="url(#agent)"/>
  <text x="380" y="226" fill="#0f1117" font-size="18" text-anchor="middle" font-weight="bold">AI 代理</text>
  <text x="380" y="248" fill="#0f1117" font-size="12" text-anchor="middle">理解 → 拆解步驟 → 呼叫工具 → 整合結果</text>
  <text x="380" y="265" fill="#0f1117" font-size="12" text-anchor="middle">（多步驟推理迴圈）</text>

  <!-- arrows user <-> agent -->
  <line x1="345" y1="144" x2="345" y2="196" stroke="#7aa2f7" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="415" y1="196" x2="415" y2="144" stroke="#bb9af7" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="300" y="176" fill="#7aa2f7" font-size="11" text-anchor="end">提問 / 指令</text>
  <text x="460" y="176" fill="#bb9af7" font-size="11">回答 / 執行結果</text>

  <!-- tools -->
  <rect x="40" y="330" width="150" height="70" rx="9" fill="url(#tool)" stroke="#3b4261"/>
  <text x="115" y="357" fill="#c0caf5" font-size="14" text-anchor="middle" font-weight="bold">檔案工具</text>
  <text x="115" y="378" fill="#565f89" font-size="11" text-anchor="middle">讀寫你的專案</text>

  <rect x="210" y="330" width="150" height="70" rx="9" fill="url(#tool)" stroke="#3b4261"/>
  <text x="285" y="357" fill="#c0caf5" font-size="14" text-anchor="middle" font-weight="bold">終端機工具</text>
  <text x="285" y="378" fill="#565f89" font-size="11" text-anchor="middle">執行 shell 指令</text>

  <rect x="380" y="330" width="150" height="70" rx="9" fill="url(#tool)" stroke="#3b4261"/>
  <text x="455" y="357" fill="#c0caf5" font-size="14" text-anchor="middle" font-weight="bold">網路工具</text>
  <text x="455" y="378" fill="#565f89" font-size="11" text-anchor="middle">搜尋 / 抓取網頁</text>

  <rect x="550" y="330" width="170" height="70" rx="9" fill="url(#tool)" stroke="#3b4261"/>
  <text x="635" y="357" fill="#c0caf5" font-size="14" text-anchor="middle" font-weight="bold">系統工具</text>
  <text x="635" y="378" fill="#565f89" font-size="11" text-anchor="middle">設定 / 日誌 / 服務</text>

  <line x1="330" y1="274" x2="150" y2="330" stroke="#565f89" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="355" y1="274" x2="290" y2="330" stroke="#565f89" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="405" y1="274" x2="455" y2="330" stroke="#565f89" stroke-width="1.8" marker-end="url(#c)"/>
  <line x1="430" y1="274" x2="610" y2="330" stroke="#565f89" stroke-width="1.8" marker-end="url(#c)"/>

  <!-- model -->
  <rect x="230" y="440" width="300" height="66" rx="10" fill="url(#llm)"/>
  <text x="380" y="467" fill="#0f1117" font-size="16" text-anchor="middle" font-weight="bold">大型語言模型（LLM）</text>
  <text x="380" y="489" fill="#0f1117" font-size="12" text-anchor="middle">本地模型（隱私優先） 或 遠端 API（OpenAI / Anthropic）</text>

  <line x1="380" y1="274" x2="380" y2="440" stroke="#9ece6a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#c)"/>
  <text x="392" y="420" fill="#9ece6a" font-size="11">思考 / 生成</text>
</svg>
